<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise pour Meryem ✨</title>
  <style>
    body {
      margin: 0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 340px;
      width: 100%;
    }
    h1 {
      color: #e91e63;
      font-size: 22px;
      margin-bottom: 15px;
    }
    .img-container {
      width: 100%;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .img-container img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      display: block;
    }
    .caption {
      color: #d81b60;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 15px;
    }
    .btn {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px 5px;
      box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
      transition: transform 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-choice {
      padding: 10px 20px;
      font-size: 15px;
    }
    #question-section, #response-section {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #e91e63;
    }
    .q-text {
      color: #333;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 15px;
    }
    #final-msg {
      color: #e91e63;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>رسالة خاصة لمريم ✨</h1>

    <!-- صورة وردة عالية الجودة ومباشرة من الإنترنت -->
    <div class="img-container">
      <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" alt="Rose">
    </div>
    <div class="caption">هذه لك وردتك 🌹✨</div>

    <!-- زر كشف السؤال -->
    <button id="show-q-btn" class="btn" onclick="showQuestion()">اضغطي هنا لمعرفة السؤال 🎁</button>

    <!-- قسم السؤال والأزرار -->
    <div id="question-section">
      <div class="q-text">3ejbk cadeaux maryoma? 🌸</div>
      <button class="btn btn-choice" onclick="selectAnswer('Oui')">Oui 💕</button>
      <button class="btn btn-choice" onclick="selectAnswer('Non')">Non 😅</button>
    </div>

    <!-- قسم الإجابة النهائية -->
    <div id="response-section">
      <div id="final-msg"></div>
    </div>
  </div>

  <script>
    function showQuestion() {
      document.getElementById('show-q-btn').style.display = 'none';
      document.getElementById('question-section').style.display = 'block';
    }

    function selectAnswer(ans) {
      document.getElementById('question-section').style.display = 'none';
      var resp = document.getElementById('response-section');
      var msg = document.getElementById('final-msg');
      
      if (ans === 'Oui') {
        msg.innerHTML = "💖 NABGHIK MARYOMAA 💖<br><br>أنا سعيد جداً لأنها أعجبتك! ✨🌸";
      } else {
        msg.innerHTML = "💖 NABGHIK MARYOMAA 💖<br><br>حتى لو ما عجبك المرة الجاية نجيبلك أحسن! 😜✨";
      }
      resp.style.display = 'block';
    }
  </script>

</body>
</html>
