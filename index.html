<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise pour Meryem ✨</title>
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(233, 30, 99, 0.25);
      max-width: 360px;
      width: 100%;
    }
    h1 {
      color: #e91e63;
      font-size: 22px;
      margin-bottom: 15px;
    }
    .img-container {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border: 3px solid #fff0f5;
    }
    .img-container img {
      width: 100%;
      height: 330px;
      object-fit: cover;
      display: block;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    .btn {
      background: linear-gradient(45deg, #ff2a75, #ff6090);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 42, 117, 0.4);
    }
    #step-2 {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px dashed #ffb6c1;
    }
    .q-title {
      color: #e91e63;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .chat-box {
      background: #fff0f5;
      border-radius: 15px;
      padding: 12px;
      height: 220px;
      overflow-y: auto;
      text-align: left;
      margin-bottom: 12px;
      border: 1px solid #ffccd5;
    }
    .chat-msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 14px;
      max-width: 80%;
      word-wrap: break-word;
      position: relative;
    }
    .msg-med {
      background: #e91e63;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }
    .msg-meryem {
      background: #ffffff;
      color: #333;
      margin-right: auto;
      border: 1px solid #ffccd5;
      border-bottom-left-radius: 2px;
    }
    .read-status {
      font-size: 11px;
      margin-top: 4px;
      text-align: right;
      opacity: 0.8;
    }
    .read-status.seen {
      color: #00d2ff;
      font-weight: bold;
    }
    .chat-input {
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #ffccd5;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }
    .identity-selector {
      margin-bottom: 10px;
      font-size: 13px;
      color: #e91e63;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Surprise pour Meryem ✨</h1>

    <div class="img-container">
      <img src="medoud.jpg" onerror="this.onerror=null; this.src='medoud.png'; this.onerror=function(){this.src='medoud.JPG'; this.onerror=function(){this.src='https://images.unsplash.com/photo-1559563458-527698bf5295?auto=format&fit=crop&w=800&q=80';}}" alt="Photo">
    </div>

    <!-- المفاجأة الأولى -->
    <div id="step-1">
      <div class="q-title">هل انتي تعشقين فيا 😂🤣؟</div>
      <div class="btn-group">
        <button class="btn" onclick="answerQuestion1('Oui 💕')">Oui 💕</button>
        <button class="btn" onclick="answerQuestion1('Non 😅')">Non 😅</button>
      </div>
    </div>

    <!-- الشات الحي مع إشارات Vu -->
    <div id="step-2">
      <div class="identity-selector">
        <label><input type="radio" name="userRole" value="Meryem" checked onclick="sendReadReceipt()"> Meryem</label>
        <label style="margin-left: 15px;"><input type="radio" name="userRole" value="Mohamed" onclick="sendReadReceipt()"> Mohamed</label>
      </div>

      <div class="chat-box" id="chat-box" onclick="sendReadReceipt()"></div>

      <div class="chat-input">
        <input type="text" id="chat-input-text" placeholder="Écris un message..." onkeypress="if(event.key==='Enter') sendLiveMessage()" onfocus="sendReadReceipt()">
        <button class="btn" onclick="sendLiveMessage()">Envoyer</button>
      </div>
    </div>
  </div>

  <script>
    const pubnub = new PubNub({
      publishKey: 'demo',
      subscribeKey: 'demo',
      userId: 'user_' + Math.floor(Math.random() * 1000)
    });

    const channelName = 'meryem_med_private_chat_room_v3';

    pubnub.subscribe({ channels: [channelName] });

    pubnub.addListener({
      message: function(m) {
        if (m.message.type === 'read_receipt') {
          markMessagesAsVu(m.message.reader);
        } else {
          displayMessage(m.message.id, m.message.sender, m.message.text);
          sendReadReceipt();
        }
      }
    });

    function answerQuestion1(choice) {
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';

      pubnub.publish({
        channel: channelName,
        message: { type: 'msg', id: Date.now(), sender: 'Meryem', text: `Réponse: ${choice}` }
      });

      setTimeout(() => {
        pubnub.publish({
          channel: channelName,
          message: { type: 'msg', id: Date.now() + 1, sender: 'Mohamed', text: 'raki ghya maryoma ? 🌸' }
        });
      }, 500);
    }

    function sendLiveMessage() {
      const input = document.getElementById('chat-input-text');
      const text = input.value.trim();
      if (!text) return;

      const role = document.querySelector('input[name="userRole"]:checked').value;

      pubnub.publish({
        channel: channelName,
        message: { type: 'msg', id: Date.now(), sender: role, text: text }
      });

      input.value = '';
    }

    function sendReadReceipt() {
      const currentRole = document.querySelector('input[name="userRole"]:checked').value;
      pubnub.publish({
        channel: channelName,
        message: { type: 'read_receipt', reader: currentRole }
      });
    }

    function displayMessage(id, sender, text) {
      const box = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      
      if (sender === 'Mohamed') {
        msgDiv.className = 'chat-msg msg-med';
        msgDiv.dataset.sender = 'Mohamed';
        msgDiv.innerHTML = `<b>Mohamed:</b> ${text}<div class="read-status" id="status-${id}">Envoyé ✔️</div>`;
      } else {
        msgDiv.className = 'chat-msg msg-meryem';
        msgDiv.dataset.sender = 'Meryem';
        msgDiv.innerHTML = `<b>Meryem:</b> ${text}<div class="read-status" id="status-${id}">Envoyé ✔️</div>`;
      }

      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }

    function markMessagesAsVu(reader) {
      const allStatuses = document.querySelectorAll('.read-status');
      allStatuses.forEach(st => {
        const parentSender = st.parentElement.dataset.sender;
        if (parentSender && parentSender !== reader) {
          st.innerHTML = 'Vu ✔️✔️';
          st.classList.add('seen');
        }
      });
    }
  </script>

</body>
</html>
