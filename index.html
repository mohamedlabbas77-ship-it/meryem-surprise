<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise pour Meryem ✨</title>
  <!-- مكتبة الدردشة المباشرة أونلاين -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(233, 30, 99, 0.25);
      max-width: 360px;
      width: 100%;
    }
    h1 {
      color: #e91e63;
      font-size: 22px;
      margin-bottom: 15px;
    }
    .img-container {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border: 3px solid #fff0f5;
    }
    .img-container img {
      width: 100%;
      height: 330px;
      object-fit: cover;
      display: block;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    .btn {
      background: linear-gradient(45deg, #ff2a75, #ff6090);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 42, 117, 0.4);
    }
    #step-2 {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px dashed #ffb6c1;
    }
    .q-title {
      color: #e91e63;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    /* تصميم صندوق المحادثة المباشرة */
    .chat-box {
      background: #fff0f5;
      border-radius: 15px;
      padding: 12px;
      height: 220px;
      overflow-y: auto;
      text-align: left;
      margin-bottom: 12px;
      border: 1px solid #ffccd5;
    }
    .chat-msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 14px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .msg-med {
      background: #e91e63;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }
    .msg-meryem {
      background: #ffffff;
      color: #333;
      margin-right: auto;
      border: 1px solid #ffccd5;
      border-bottom-left-radius: 2px;
    }
    .chat-input {
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #ffccd5;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
    }
    .identity-selector {
      margin-bottom: 10px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Surprise pour Meryem ✨</h1>

    <!-- صورتك المرفوعة باسم medoud.jpg -->
    <div class="img-container">
      <img src="medoud.jpg" onerror="this.src='medoud.JPG'; this.onerror=function(){this.src='medoud.png';}" alt="Photo de Mohamed">
    </div>

    <!-- السؤال الأول (المفاجأة الأولى) -->
    <div id="step-1">
      <div class="q-title">هل انتي تعشقين فيا 😂🤣؟</div>
      <div class="btn-group">
        <button class="btn" onclick="answerQuestion1('Oui 💕')">Oui 💕</button>
        <button class="btn" onclick="answerQuestion1('Non 😅')">Non 😅</button>
      </div>
    </div>

    <!-- السؤال الثاني والدردشة المباشرة أونلاين -->
    <div id="step-2">
      <div class="q-title">raki ghya maryoma ? 🌸</div>
      
      <!-- اختيار من يتحدث في الشات (أنت أو هي) -->
      <div class="identity-selector">
        <label><input type="radio" name="userRole" value="Meryem" checked> Meryem</label>
        <label style="margin-left: 15px;"><input type="radio" name="userRole" value="Mohamed"> Mohamed</label>
      </div>

      <div class="chat-box" id="chat-box"></div>

      <div class="chat-input">
        <input type="text" id="chat-input-text" placeholder="Écris un message..." onkeypress="if(event.key==='Enter') sendLiveMessage()">
        <button class="btn" onclick="sendLiveMessage()">Envoyer</button>
      </div>
    </div>
  </div>

  <script>
    // إعداد سيرفر الدردشة المباشر (PubNub Demo Keys)
    const pubnub = new PubNub({
      publishKey: 'demo',
      subscribeKey: 'demo',
      userId: 'user_' + Math.floor(Math.random() * 1000)
    });

    const channelName = 'meryem_med_private_chat';

    pubnub.subscribe({ channels: [channelName] });

    pubnub.addListener({
      message: function(m) {
        displayMessage(m.message.sender, m.message.text);
      }
    });

    function answerQuestion1(choice) {
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';

      // إرسال الإجابة الأولى للشات تلقائياً
      pubnub.publish({
        channel: channelName,
        message: { sender: 'Meryem', text: `Réponse: ${choice}` }
      });
    }

    function sendLiveMessage() {
      const input = document.getElementById('chat-input-text');
      const text = input.value.trim();
      if (!text) return;

      const role = document.querySelector('input[name="userRole"]:checked').value;

      pubnub.publish({
        channel: channelName,
        message: { sender: role, text: text }
      });

      input.value = '';
    }

    function displayMessage(sender, text) {
      const box = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      
      if (sender === 'Mohamed') {
        msgDiv.className = 'chat-msg msg-med';
        msgDiv.innerHTML = `<b>Mohamed:</b> ${text}`;
      } else {
        msgDiv.className = 'chat-msg msg-meryem';
        msgDiv.innerHTML = `<b>Meryem:</b> ${text}`;
      }

      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }
  </script>

</body>
</html>
