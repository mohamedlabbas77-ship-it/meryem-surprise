<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise pour Meryem ✨</title>
  <style>
    body {
      margin: 0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(233, 30, 99, 0.25);
      max-width: 350px;
      width: 100%;
      backdrop-filter: blur(5px);
    }
    h1 {
      color: #e91e63;
      font-size: 22px;
      margin-top: 5px;
      margin-bottom: 15px;
    }
    .img-container {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      border: 3px solid #fff0f5;
    }
    .img-container img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    .btn {
      background: linear-gradient(45deg, #ff2a75, #ff6090);
      color: white;
      border: none;
      padding: 12px 26px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 42, 117, 0.4);
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.95);
    }
    #next-step {
      display: none;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px dashed #ffb6c1;
    }
    .question-title {
      color: #e91e63;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .love-msg {
      color: #d81b60;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    textarea {
      width: 90%;
      height: 80px;
      border: 2px solid #ffccd5;
      border-radius: 12px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      outline: none;
      margin-bottom: 12px;
    }
    textarea:focus {
      border-color: #e91e63;
    }
    #confirmation-msg {
      display: none;
      color: #4caf50;
      font-weight: bold;
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Surprise pour Meryem ✨</h1>

    <!-- صورة وردة رائعة جداً -->
    <div class="img-container">
      <img src="https://images.unsplash.com/photo-1559563458-527698bf5295?auto=format&fit=crop&w=800&q=80" alt="Rose for Meryem">
    </div>

    <!-- أزرار Oui / Non أسفل الوردة مباشرة -->
    <div id="initial-buttons" class="btn-group">
      <button class="btn" onclick="handleChoice('Oui')">Oui 💕</button>
      <button class="btn" onclick="handleChoice('Non')">Non 😅</button>
    </div>

    <!-- الجزء التفاعلي الذي يظهر بعد الضغط -->
    <div id="next-step">
      <div class="question-title">3ejbk cadeaux maryoma? 🌸</div>
      <div class="love-msg">💖 NABGHIK MARYOMAA 💖</div>

      <!-- مكان كتابة الملاحظة / المحادثة -->
      <textarea id="user-note" placeholder="Écris une remarque ou un message ici... ✨"></textarea>
      <br>
      <button class="btn" onclick="sendDiscussion()">Envoyer le message 💌</button>
      
      <div id="confirmation-msg">Merci Maryoma ! Votre message a été envoyé ✨💖</div>
    </div>
  </div>

  <script>
    let chosenAnswer = '';

    function handleChoice(choice) {
      chosenAnswer = choice;
      document.getElementById('initial-buttons').style.display = 'none';
      document.getElementById('next-step').style.display = 'block';
    }

    function sendDiscussion() {
      const note = document.getElementById('user-note').value;
      if (!note.trim()) {
        alert("S'il te plaît, écris un petit mot avant d'envoyer ! ✨");
        return;
      }

      // إخفاء زر الإرسال وتأكيد وصول الرسالة
      document.getElementById('user-note').disabled = true;
      document.getElementById('confirmation-msg').style.display = 'block';

      // فتح تطبيق الإرسال المباشر أو المحادثة إذا رغبت
      const text = `Réponse de Meryem:\nChoix: ${chosenAnswer}\nQuestion: 3ejbk cadeaux maryoma?\nRemarque: ${note}`;
      console.log(text);
    }
  </script>

</body>
</html>
