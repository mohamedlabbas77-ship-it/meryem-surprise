<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise pour Meryem ✨</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 320px;
      width: 90%;
    }
    h1 {
      color: #e91e63;
      font-size: 24px;
      margin-bottom: 15px;
    }
    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
    }
    .heart-btn {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
      transition: transform 0.2s;
    }
    .heart-btn:active {
      transform: scale(0.95);
    }
    #hidden-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fff0f5;
      border-radius: 12px;
      border: 1px dashed #e91e63;
      color: #d81b60;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>رسالة خاصة لمريم ✨</h1>
    <p>اضغطي على الزر للتأكد من الرسالة!</p>
    
    <button class="heart-btn" onclick="showSurprise()">اضغطي هنا 🎁</button>

    <div id="hidden-message">
      💖 NABGHIK MARYOMAA 💖<br><br>
      أفضل صديقة ومصدر للضحك والدعم دائماً! ✨🌸
    </div>
  </div>

  <script>
    function showSurprise() {
      var msg = document.getElementById('hidden-message');
      if (msg.style.display === 'block') {
        msg.style.display = 'none';
      } else {
        msg.style.display = 'block';
      }
    }
  </script>

</body>
</html>
